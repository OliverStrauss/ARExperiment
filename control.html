<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sticky-wall · control</title>
  <link rel="stylesheet" href="css/style.css">
  <script async src="vendor/opencv.js"></script>
</head>
<body>
  <div class="topbar">
    <h1>sticky-wall</h1>
    <label>Camera
      <select id="cameraSelect"><option value="">Loading…</option></select>
    </label>
    <button id="refreshCams" title="Re-scan cameras">↻</button>
    <span class="spacer"></span>
    <button id="openProjector" title="Opens projector.html in a new window; drag it to the projector">Open projector window</button>
    <button id="calibrate" class="primary">Calibrate</button>
  </div>

  <div class="layout">
    <div>
      <div class="banner" id="banner" hidden></div>
      <div class="card">
        <h2>Camera</h2>
        <div class="feed-wrap" id="feedWrap">
          <canvas class="feed" id="feed" width="1280" height="720"></canvas>
          <canvas class="magnifier" id="magnifier" width="140" height="140"></canvas>
        </div>
        <div class="row">
          <label><input type="checkbox" id="crossTest"> Crosshair test (move the mouse over the feed; a crosshair should appear at the same spot on the wall)</label>
          <button id="forgetCalib">Forget calibration</button>
        </div>
      </div>
      <div class="card" id="calibPanel" style="margin-top:14px" hidden>
        <h2>Calibration</h2>
        <div class="status" id="calibMsg"></div>
        <div class="row">
          <button id="calibUndo">Undo point</button>
          <button id="calibClear">Clear points</button>
          <button id="calibDone" class="primary">Done</button>
          <label><input type="checkbox" id="calibSnap" checked> Snap clicks to the dot centre</label>
        </div>
      </div>
      <div class="card" id="simPanel" style="margin-top:14px" hidden>
        <h2>Simulated wall</h2>
        <div class="row">
          <button id="simAdd">Add note</button>
          <button id="simRemove">Remove note</button>
          <button id="simShuffle">Shuffle notes</button>
          <label><input type="checkbox" id="simNoise" checked> Sensor noise</label>
        </div>
        <div class="status">Drag notes in the camera view to move them. The projector picture is mirrored onto the fake wall.</div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Status</h2>
        <div class="status" id="status">Starting…</div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Threshold mask</h2>
        <canvas class="mask" id="mask" width="640" height="360"></canvas>
      </div>
      <div class="card sliders" style="margin-top:14px">
        <h2>Settings <button id="resetSettings" style="float:right;padding:2px 8px">Defaults</button></h2>
        <div id="sliders"></div>
      </div>
    </div>
  </div>

  <video id="video" playsinline muted hidden></video>
  <script type="module" src="js/control.js"></script>
</body>
</html>
